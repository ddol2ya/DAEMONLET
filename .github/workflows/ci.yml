name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: npm ci
      # Electron 43 exposes install-electron instead of an npm postinstall hook.
      # Fetch only the lockfile-pinned runtime and its notices; never creator models.
      - run: npm run electron:install
      - run: python -m pip install -r scripts/characters/requirements.txt
      - run: npm run source:check
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s tests/creator -v
      - run: npm run creator:check
      - run: npm run build:renderer
      - run: npm run build:electron:production
      - run: npm run release:verify
      - run: npm run creator:package -- --output outputs/creator-ci
      - run: npm run creator:verify -- outputs/creator-ci/Daemonlet-creator-skill-$(node -p "require('./package.json').version").zip
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run electron:install
      - run: npm run source:check
      - run: npm run typecheck
      # POSIX Hook host/permission cases are explicitly skipped on Windows;
      # the existing Unix job still runs them. This is not native app acceptance.
      - run: npm test
      - run: npm run build:renderer
      - run: npm run build:electron:production
      - run: npm run release:verify
